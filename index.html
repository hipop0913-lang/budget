<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b6cf6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 가계부">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>우리 가계부</title>
</head>
<body>
<main id="app">

  <!-- 로그인 -->
  <section id="view-login" class="center" hidden>
    <div class="logo">💑</div>
    <h1>우리 가계부</h1>
    <p class="sub">둘이 함께 쓰는 가계부예요.<br>처음이면 이메일과 비밀번호를 쓰고 <b>가입</b>을 누르세요.</p>
    <input id="email" type="email" placeholder="이메일" autocomplete="email">
    <input id="password" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
    <div class="row">
      <button id="btn-login" class="primary">로그인</button>
      <button id="btn-signup">가입</button>
    </div>
    <p id="login-msg" class="msg"></p>
  </section>

  <!-- 부부 연결 -->
  <section id="view-household" class="center" hidden>
    <div class="logo">🔗</div>
    <h1>부부 연결</h1>
    <p class="sub">한 명이 <b>새로 만들기</b>를 누르면 초대 코드가 나와요.<br>다른 한 명은 그 코드를 입력하세요.</p>
    <button id="btn-create" class="primary wide">새로 만들기</button>
    <div class="or">또는</div>
    <input id="join-code" placeholder="초대 코드 6자리" maxlength="6" autocapitalize="characters">
    <button id="btn-join" class="wide">코드로 참여</button>
    <p id="hh-msg" class="msg"></p>
    <button id="btn-logout-1" class="link">로그아웃</button>
  </section>

  <!-- 메인 -->
  <section id="view-main" hidden>
    <div class="topbar">
      <button id="prev" class="icon" aria-label="이전 달">‹</button>
      <h2 id="month-label"></h2>
      <button id="next" class="icon" aria-label="다음 달">›</button>
    </div>

    <div class="hero">
      <div class="hero-label" id="hero-label">이번 달 지출</div>
      <div class="hero-amt" id="sum-out">0원</div>
      <div class="hero-row">
        <div><span>수입</span><b id="sum-in">0원</b></div>
        <div><span>남은 돈</span><b id="sum-total">0원</b></div>
      </div>
    </div>

    <div class="filters">
      <div class="chips" id="person-chips">
        <button data-p="all" class="on">전체</button>
        <button data-p="me">나</button>
        <button data-p="other">상대</button>
      </div>
      <select id="pay-filter" aria-label="결제수단"></select>
    </div>

    <div id="list"></div>
    <div id="empty" class="empty" hidden>
      <div class="big">🧾</div>
      <p>이 달의 내역이 없어요.<br>오른쪽 아래 <b>+</b> 버튼으로 추가해 보세요.</p>
    </div>

    <footer>
      <span id="code-info"></span>
      <span><button id="btn-nick" class="link">별명</button> · <button id="btn-logout-2" class="link">로그아웃</button></span>
    </footer>
    <button id="fab" aria-label="추가">+</button>
  </section>

  <!-- 입력/수정 창 -->
  <dialog id="dlg">
    <form method="dialog" id="form">
      <h3 id="dlg-title">내역 추가</h3>
      <div class="seg">
        <label><input type="radio" name="type" value="out" checked><span>지출</span></label>
        <label><input type="radio" name="type" value="in"><span>수입</span></label>
      </div>
      <div class="amount-wrap"><input id="f-amount" inputmode="numeric" placeholder="0" autocomplete="off" required><em>원</em></div>
      <div class="lbl">카테고리</div>
      <div class="grid" id="cat-grid"></div>
      <div class="lbl">결제수단</div>
      <div class="chips wrap" id="pay-chips"></div>
      <div class="lbl">날짜 / 메모</div>
      <input id="f-date" type="date" required>
      <input id="f-memo" placeholder="메모 (선택)" maxlength="60">
      <div class="row">
        <button type="button" id="f-delete" class="danger" hidden>삭제</button>
        <button type="button" id="f-cancel">취소</button>
        <button type="submit" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <!-- 별명 창 -->
  <dialog id="dlg-nick">
    <form method="dialog" id="form-nick">
      <h3>내 별명</h3>
      <p class="sub">내역에 누가 썼는지 보여줄 이름이에요. (예: 오빠, 자기, 민수)</p>
      <input id="nick-input" placeholder="별명" maxlength="8" required>
      <button type="submit" class="primary wide">저장</button>
    </form>
  </dialog>
</main>
<script type="module" src="app.js"></script>
</body>
</html>

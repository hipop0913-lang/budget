<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리 가계부">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>우리 가계부</title>
</head>
<body>
<main id="app">

  <!-- 1. 로그인 -->
  <section id="view-login" hidden>
    <h1>우리 가계부</h1>
    <p class="sub">이메일과 비밀번호로 로그인하세요.<br>처음이면 "가입"을 누르세요.</p>
    <input id="email" type="email" placeholder="이메일" autocomplete="email">
    <input id="password" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
    <div class="row">
      <button id="btn-login" class="primary">로그인</button>
      <button id="btn-signup">가입</button>
    </div>
    <p id="login-msg" class="msg"></p>
  </section>

  <!-- 2. 가구 연결 -->
  <section id="view-household" hidden>
    <h1>부부 연결</h1>
    <p class="sub">한 명이 "새로 만들기"를 누르면 <b>초대 코드</b>가 나와요.<br>다른 한 명은 그 코드를 입력하세요.</p>
    <button id="btn-create" class="primary">새로 만들기</button>
    <hr>
    <input id="join-code" placeholder="초대 코드 입력">
    <button id="btn-join">코드로 참여</button>
    <p id="hh-msg" class="msg"></p>
    <button id="btn-logout-1" class="link">로그아웃</button>
  </section>

  <!-- 3. 가계부 -->
  <section id="view-main" hidden>
    <header>
      <button id="prev" class="icon">‹</button>
      <h2 id="month-label"></h2>
      <button id="next" class="icon">›</button>
    </header>
    <div class="summary">
      <div><span>수입</span><b id="sum-in" class="in">0</b></div>
      <div><span>지출</span><b id="sum-out" class="out">0</b></div>
      <div><span>합계</span><b id="sum-total">0</b></div>
    </div>
    <ul id="list"></ul>
    <p id="empty" class="sub" hidden>이 달의 내역이 없어요. 아래 + 버튼으로 추가하세요.</p>
    <footer>
      <span id="code-info"></span>
      <button id="btn-logout-2" class="link">로그아웃</button>
    </footer>
    <button id="fab">+</button>
  </section>

  <!-- 입력 창 -->
  <dialog id="dlg">
    <form method="dialog" id="form">
      <div class="seg">
        <label><input type="radio" name="type" value="out" checked><span>지출</span></label>
        <label><input type="radio" name="type" value="in"><span>수입</span></label>
      </div>
      <input id="f-amount" type="number" inputmode="numeric" placeholder="금액 (원)" required min="1">
      <select id="f-cat"></select>
      <input id="f-memo" placeholder="메모 (선택)">
      <input id="f-date" type="date" required>
      <div class="row">
        <button type="button" id="f-cancel">취소</button>
        <button type="submit" class="primary">저장</button>
      </div>
    </form>
  </dialog>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
